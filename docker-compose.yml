services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: aplikacja_trenerska
      POSTGRES_USER: aplikacja
      POSTGRES_PASSWORD: aplikacja_dev_haslo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aplikacja -d aplikacja_trenerska"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,dev}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-jwt-secret-min-32-znakow-dla-hs256-aplikacja-trenerska}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@aplikacja.local}
      APP_ACCOUNT_EMAIL_CONFIRMATION_TTL: ${APP_ACCOUNT_EMAIL_CONFIRMATION_TTL:-24h}
      APP_ACCOUNT_PASSWORD_RESET_TTL: ${APP_ACCOUNT_PASSWORD_RESET_TTL:-30m}
      APP_ACCOUNT_ACCOUNT_DELETION_TTL: ${APP_ACCOUNT_ACCOUNT_DELETION_TTL:-30m}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
