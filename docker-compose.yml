services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: aplikacja_trenerska
      POSTGRES_USER: aplikacja
      POSTGRES_PASSWORD: aplikacja_dev_haslo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aplikacja -d aplikacja_trenerska"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
