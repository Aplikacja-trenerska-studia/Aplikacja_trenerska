# Never inherit local database, JWT, SMTP or development-account defaults on the public deployment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0

# Flyway needs a session-capable connection; runtime traffic may use the transaction pooler.
spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_FLYWAY_USER}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.default-schema=training_app
spring.flyway.schemas=training_app
spring.jpa.properties.hibernate.default_schema=training_app

app.jwt.secret=${APP_JWT_SECRET}
app.account.frontend-url=${APP_FRONTEND_URL}
app.account.mail-from=${APP_MAIL_FROM:}
app.cors.allowed-origin-patterns=

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
