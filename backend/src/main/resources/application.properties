spring.application.name=aplikacja-trenerska

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/aplikacja_trenerska
spring.datasource.username=aplikacja
spring.datasource.password=aplikacja_dev_haslo

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET:dev-jwt-secret-min-32-znakow-dla-hs256-aplikacja-trenerska}
app.jwt.expiration-ms=86400000

app.account.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.account.mail-from=${APP_MAIL_FROM:no-reply@aplikacja.local}
app.account.email-confirmation-ttl=${APP_ACCOUNT_EMAIL_CONFIRMATION_TTL:24h}
app.account.password-reset-ttl=${APP_ACCOUNT_PASSWORD_RESET_TTL:30m}
app.account.account-deletion-ttl=${APP_ACCOUNT_ACCOUNT_DELETION_TTL:30m}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
